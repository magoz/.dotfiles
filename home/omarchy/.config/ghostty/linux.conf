# Omarchy integration for my Ghostty config (included from config).

# Omarchy's unified copy/paste (Super+C/V) sends these keys to terminals.
keybind = shift+insert=paste_from_clipboard
keybind = control+insert=copy_to_clipboard

# Send Shift+Enter as CSI-u so TUIs (Pi, OpenCode) can tell it from Enter.
keybind = shift+enter=csi:13;2u

# Fix general slowness on Hyprland (https://github.com/ghostty-org/ghostty/discussions/3224).
async-backend = epoll
