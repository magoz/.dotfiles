# Leader menu (Leader Key on macOS, home/leaderkey/.config/leaderkey/config.json).
# Opened with the binding in hypr/bindings.lua; Escape closes it. Apps focus an existing
# window (omarchy-launch-or-focus, matching the window class) and only launch if none is open.
font: JetBrainsMono Nerd Font 13
background: "#1a1b26e6"
color: "#c0caf5"
border: "#7aa2f7"
separator: "  "
border_width: 2
corner_r: 12
padding: 16
rows_per_column: 8
anchor: center
inhibit_compositor_keyboard_shortcuts: true

menu:
  - key: c
    desc: Chrome
    cmd: omarchy-launch-or-focus '^google-chrome$' 'uwsm-app -- google-chrome-stable'
  - key: d
    desc: Todoist
    cmd: omarchy-launch-or-focus-webapp Todoist https://app.todoist.com
  - key: s
    desc: Spotify
    cmd: omarchy-launch-or-focus '^spotify$' 'uwsm-app -- spotify'
  - key: g
    desc: Ghostty
    cmd: omarchy-launch-or-focus '^com.mitchellh.ghostty$' 'uwsm-app -- ghostty'
  - key: t
    desc: Telegram
    cmd: omarchy-launch-or-focus '^org.telegram.desktop$' 'uwsm-app -- Telegram'
  - key: f
    desc: Folders
    submenu:
      - key: d
        desc: Downloads
        cmd: xdg-open "$HOME/Downloads"
      - key: w
        desc: Working
        cmd: xdg-open "$HOME/Dropbox/projects/working"
      - key: b
        desc: BPI France
        cmd: xdg-open "$HOME/Dropbox/projects/working/bpi france"
      - key: g
        desc: Geoplan
        cmd: xdg-open "$HOME/Dropbox/projects/working/geoplan"
  - key: m
    desc: Email
    submenu:
      - key: "1"
        desc: Gmail 1
        cmd: xdg-open https://mail.google.com/mail/u/0/
      - key: "2"
        desc: Gmail 2
        cmd: xdg-open https://mail.google.com/mail/u/1/
  - key: r
    desc: Utilities
    submenu:
      - key: e
        desc: Emoji
        cmd: omarchy-shell shell toggle omarchy.emojis
      - key: c
        desc: Camera
        cmd: mpv --no-audio --profile=low-latency --untimed av://v4l2:/dev/video0
